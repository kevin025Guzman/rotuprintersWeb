<section class="galeria" id="galeria">
  <div class="section-header">
    <span class="section-tag">Galería</span>
    <h2 class="subtitles">Instalaciones y Trabajos</h2>
    <p class="products-intro">Un vistazo a nuestro proceso, instalaciones y resultados finales</p>
  </div>

  <div class="carousel" aria-roledescription="carrusel" aria-label="Galería RotuPrinters">
    <button class="carousel-btn prev" type="button" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>

    <div class="carousel-viewport" tabindex="0" aria-label="Galería (usa flechas izquierda y derecha)">
      <div class="carousel-track" id="gallery-track-1">
      </div>
    </div>

    <button class="carousel-btn next" type="button" aria-label="Foto siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>

    <div class="carousel-dots" role="tablist" aria-label="Seleccionar foto">
    </div>
  </div>

  <div class="carousel" data-reverse="true" style="margin-top: 2rem;" aria-roledescription="carrusel"
    aria-label="Galería RotuPrinters 2">
    <button class="carousel-btn prev" type="button" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>

    <div class="carousel-viewport" tabindex="0" aria-label="Galería (usa flechas izquierda y derecha)">
      <div class="carousel-track" id="gallery-track-2">
      </div>
    </div>

    <button class="carousel-btn next" type="button" aria-label="Foto siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>

    <div class="carousel-dots" role="tablist" aria-label="Seleccionar foto">
    </div>
  </div>

  <!-- Lightbox Modal para vista completa y deslizamiento -->
  <div class="lightbox" id="lightbox" aria-hidden="true">
    <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar vista completa">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 6L6 18M6 6l12 12" />
      </svg>
    </button>
    <button class="lightbox-btn prev" id="lightbox-prev" aria-label="Imagen anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M15 18l-6-6 6-6" />
      </svg>
    </button>
    <div class="lightbox-content" id="lightbox-content">
      <img id="lightbox-img" src="" alt="Trabajo RotuPrinters" />
      <span class="lightbox-counter" id="lightbox-counter"></span>
    </div>
    <button class="lightbox-btn next" id="lightbox-next" aria-label="Imagen siguiente">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>
</section>
